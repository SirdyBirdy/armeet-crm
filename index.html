<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">Today</h1><div class="sub" id="sub"></div></div>
    <button class="sync" id="sync"><i></i><span>Local</span></button>
  </header>
  <div class="seg" id="seg">
    <button data-t="today" class="on">Today</button>
    <button data-t="inquiry">Inquiries</button>
    <button data-t="client">Clients</button>
  </div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Add person">+</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
